services:
  - type: web
    name: mcp-grid-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
